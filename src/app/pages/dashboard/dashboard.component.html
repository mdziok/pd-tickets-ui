<main class="page">
  <section class="panel">
    <span class="eyebrow">PANEL UŻYTKOWNIKA</span>
    <h1>Dashboard</h1>
    <p class="intro">Podsumowanie Twoich zgłoszeń</p>

    @if (loading) {
      <div class="stat-card"><span class="stat-label">Pobieranie danych...</span><p class="stat-value">…</p></div>
    } @else if (errorMessage) {
      <p class="result error">{{ errorMessage }}</p>
    } @else {
      <div class="stat-card">
        <span class="stat-label">Moje zgłoszenia</span>
        <p class="stat-value">{{ tickets.length }}</p>
      </div>
      <p class="intro">Zgłoszenia aktualizują się automatycznie.</p>
    }
  </section>
</main>
